name: Deploy Backend to Lightsail

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "infra/cloudformation/backend-stack.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || secrets.AWS_DEFAULT_REGION }}

      - name: Deploy CloudFormation backend stack
        id: cfn
        env:
          STACK_NAME: judgesync-backend
          SERVICE_NAME: ${{ secrets.LIGHTSAIL_SERVICE_NAME || 'judgesync-backend' }}
          POWER: ${{ secrets.LIGHTSAIL_POWER || 'micro' }}
          SCALE: ${{ secrets.LIGHTSAIL_SCALE || '1' }}
        run: |
          echo "Deploying CloudFormation stack: $STACK_NAME"
          CFN_REGION=${AWS_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}

          echo "Checking if stack already exists..."
          if aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$CFN_REGION" \
            --query 'Stacks[0].StackStatus' >/dev/null 2>&1; then
            BOOTSTRAP=false
            echo "Stack exists. Skipping bootstrap deployment."
          else
            BOOTSTRAP=true
            echo "Stack does not exist. Bootstrapping initial deployment."
          fi

          aws cloudformation deploy \
            --template-file infra/cloudformation/backend-stack.yml \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              ContainerServiceName="$SERVICE_NAME" \
              Power="$POWER" \
              Scale="$SCALE" \
              HealthCheckPath=/health \
              ContainerPort=8787 \
              BootstrapDeployment=$BOOTSTRAP \
            --no-fail-on-empty-changeset \
            --region "$CFN_REGION"

          echo "Extracting stack outputs..."
          SERVICE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$CFN_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`ContainerServiceName`].OutputValue' \
            --output text)

          SERVICE_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$CFN_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`ContainerServiceUrl`].OutputValue' \
            --output text)

          echo "service_name=$SERVICE_NAME" >> "$GITHUB_OUTPUT"
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

          echo "✅ Lightsail service: $SERVICE_NAME"
          echo "✅ Service URL: $SERVICE_URL"

      - name: Wait for Lightsail service to be ready
        env:
          SERVICE_NAME: ${{ steps.cfn.outputs.service_name }}
        run: |
          echo "Waiting for Lightsail service to be ACTIVE..."
          for i in {1..30}; do
            STATE=$(aws lightsail get-container-services \
              --service-name "$SERVICE_NAME" \
              --query 'containerServices[0].state' \
              --output text)

            echo "Current state: $STATE (attempt $i/30)"

            case "$STATE" in
              RUNNING|READY|ACTIVE)
                echo "✅ Service is ready!"
                exit 0
                ;;
              CREATING|PREPARING|PENDING|UPDATING|DEPLOYING)
                echo "Deployment in progress. Waiting..."
                sleep 10
                ;;
              DISABLED|PAUSED)
                echo "⚠️ Service is $STATE. Please enable or resume it before redeploying."
                exit 1
                ;;
              DELETING)
                echo "❌ Service is being deleted. Aborting deployment."
                exit 1
                ;;
              *)
                echo "ℹ️ Unexpected state '$STATE'. Waiting a bit longer..."
                sleep 10
                ;;
            esac
          done

          echo "⚠️ Timeout waiting for service to be ready"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t judgesync-backend:latest backend

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Push container image to Lightsail
        id: push
        env:
          SERVICE_NAME: ${{ steps.cfn.outputs.service_name }}
        run: |
          echo "Pushing container image to $SERVICE_NAME..."

          aws lightsail push-container-image \
            --service-name "$SERVICE_NAME" \
            --label backend \
            --image judgesync-backend:latest \
            --output json > push-output.json

          IMAGE_NAME=$(jq -r '.image' push-output.json)
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "✅ Pushed image: $IMAGE_NAME"

      - name: Deploy container to Lightsail
        env:
          SERVICE_NAME: ${{ steps.cfn.outputs.service_name }}
          IMAGE_NAME: ${{ steps.push.outputs.image }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
        run: |
          echo "Creating deployment for $SERVICE_NAME..."

          # Create container configuration
          cat > containers.json <<'CONTAINERS_EOF'
          {
            "backend": {
              "image": "$IMAGE_NAME",
              "command": [],
              "ports": {
                "8787": "HTTP"
              },
              "environment": {
                "PORT": "8787",
                "NODE_ENV": "production",
                "UPSTASH_REDIS_REST_URL": "$UPSTASH_REDIS_REST_URL",
                "UPSTASH_REDIS_REST_TOKEN": "$UPSTASH_REDIS_REST_TOKEN",
                "UPSTASH_REDIS_URL": "$UPSTASH_REDIS_URL"
              }
            }
          }
          CONTAINERS_EOF

          # Substitute environment variables in containers.json
          sed -i "s|\$IMAGE_NAME|$IMAGE_NAME|g" containers.json
          sed -i "s|\$UPSTASH_REDIS_REST_URL|$UPSTASH_REDIS_REST_URL|g" containers.json
          sed -i "s|\$UPSTASH_REDIS_REST_TOKEN|$UPSTASH_REDIS_REST_TOKEN|g" containers.json
          sed -i "s|\$UPSTASH_REDIS_URL|$UPSTASH_REDIS_URL|g" containers.json

          # Create public endpoint configuration
          cat > endpoint.json <<'ENDPOINT_EOF'
          {
            "containerName": "backend",
            "containerPort": 8787,
            "healthCheck": {
              "healthyThreshold": 2,
              "unhealthyThreshold": 2,
              "timeoutSeconds": 5,
              "intervalSeconds": 30,
              "path": "/health"
            }
          }
          ENDPOINT_EOF

          # Deploy
          aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers file://containers.json \
            --public-endpoint file://endpoint.json

          echo "✅ Deployment initiated"
          SERVICE_URL="${{ steps.cfn.outputs.service_url }}"
          echo "🔗 Service will be available at: $SERVICE_URL"

      - name: Summary
        run: |
          echo "## 🚀 Backend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service Name:** \`${{ steps.cfn.outputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Service URL:** ${{ steps.cfn.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.push.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment will take 5-10 minutes to become active." >> $GITHUB_STEP_SUMMARY
