AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Static hosting for the JudgeSync frontend (S3 + CloudFront + ACM certificate)

Parameters:
  SiteDomainName:
    Type: String
    Description: Fully qualified domain name to serve the site (e.g. app.example.com)
    Default: ""
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone ID that manages the domain (leave blank to skip DNS record)
    Default: ""
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name for the built frontend assets
    Default: ""

Conditions:
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, ""]]
  BucketNameProvided: !Not [!Equals [!Ref BucketName, ""]]
  HasDomain: !Not [!Equals [!Ref SiteDomainName, ""]]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - BucketNameProvided
        - !Ref BucketName
        - !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}-frontend"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      Tags:
        - Key: Application
          Value: JudgeSync
        - Key: Stack
          Value: !Ref AWS::StackName

  FrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref SiteDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref SiteDomainName
          HostedZoneId:
            !If [HasHostedZone, !Ref HostedZoneId, !Ref "AWS::NoValue"]
      Tags:
        - Key: Application
          Value: JudgeSync

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Allow CloudFront sigv4 access to S3 bucket
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !If
          - HasDomain
          - !Sub "Frontend for ${SiteDomainName}"
          - "Frontend for JudgeSync"
        Aliases: !If
          - HasDomain
          - [!Ref SiteDomainName]
          - !Ref "AWS::NoValue"
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !If
            - HasDomain
            - !Ref FrontendCertificate
            - !Ref "AWS::NoValue"
          CloudFrontDefaultCertificate: !If
            - HasDomain
            - !Ref "AWS::NoValue"
            - true
          MinimumProtocolVersion: !If
            - HasDomain
            - TLSv1.2_2021
            - !Ref "AWS::NoValue"
          SslSupportMethod: !If
            - HasDomain
            - sni-only
            - !Ref "AWS::NoValue"
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref FrontendOAC
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendDNSRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref SiteDomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt FrontendDistribution.DomainName
        EvaluateTargetHealth: false

Outputs:
  SiteBucketName:
    Description: S3 bucket hosting the frontend artifacts
    Value: !Ref FrontendBucket

  CloudFrontURL:
    Description: Default CloudFront domain for the distribution
    Value: !Sub "https://${FrontendDistribution.DomainName}"

  DistributionId:
    Description: CloudFront distribution ID (use for invalidations)
    Value: !Ref FrontendDistribution

  CertificateArn:
    Condition: HasDomain
    Description: ACM certificate ARN (issued in us-east-1)
    Value: !Ref FrontendCertificate
